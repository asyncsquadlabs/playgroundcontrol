name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux tests and Windows cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: |
          go mod download
          go mod verify
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Check dashboard JavaScript
        run: node --check internal/server/ui/app.js
      - name: Vet Windows target
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: Build Windows executable
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -o /tmp/PlaygroundControl.exe ./cmd/playgroundcontrol

  windows:
    name: Windows native tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath -buildvcs=false -o PlaygroundControl.exe ./cmd/playgroundcontrol

  security:
    name: Security scanners
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Vulnerability scan
        run: govulncheck ./...
      - name: Security static analysis
        run: gosec -quiet ./...
      - name: Go static analysis
        run: staticcheck ./...
      - name: Secret scan
        run: gitleaks dir . --no-banner --redact --exit-code 1
