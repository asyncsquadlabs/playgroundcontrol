name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux tests and Windows cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: |
          go mod download
          go mod verify
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Check dashboard JavaScript
        run: node --check internal/server/ui/app.js
      - name: Vet Windows target
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: Build Windows executable
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -o /tmp/PlaygroundControl.exe ./cmd/playgroundcontrol

  windows:
    name: Windows native tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath -buildvcs=false -o PlaygroundControl.exe ./cmd/playgroundcontrol

  windows-service-smoke:
    name: Windows service startup smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build executable
        shell: pwsh
        run: |
          go build -trimpath -buildvcs=false -o "$env:RUNNER_TEMP\PlaygroundControl.exe" ./cmd/playgroundcontrol
      - name: Start service and verify health
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceName = 'PlaygroundControl'
          $exe = Join-Path $env:RUNNER_TEMP 'PlaygroundControl.exe'
          function Remove-SmokeService {
            Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            sc.exe delete $serviceName 2>$null | Out-Null
          }
          function Write-SmokeDiagnostics {
            Write-Host 'Service smoke test failed.'
            if (Test-Path 'C:\ProgramData\PlaygroundControl\service.log') {
              Write-Host '--- service.log ---'
              Get-Content 'C:\ProgramData\PlaygroundControl\service.log' -Tail 80
            }
            Write-Host '--- Event Log ---'
            Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='PlaygroundControl'} -MaxEvents 20 -ErrorAction SilentlyContinue | Format-List
          }
          Remove-SmokeService
          try {
            New-Service -Name $serviceName -BinaryPathName "`"$exe`" --service" -StartupType Manual -DisplayName 'Playground Control CI Smoke'
            try { Start-Service -Name $serviceName } catch { Write-Host "Start-Service reported: $_" }
            $deadline = (Get-Date).AddSeconds(120)
            $healthy = $false
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 -Uri 'http://127.0.0.1:8080/api/v1/health'
                if ($response.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {}
              $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
              if ($null -eq $service -or $service.Status -eq 'Stopped') {
                break
              }
            }
            $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
            if (-not $healthy) {
              Write-SmokeDiagnostics
              throw "Service did not become healthy. Status: $($service.Status)"
            }
            Write-Host "Service state: $($service.Status); health endpoint returned HTTP 200."
          } catch {
            if (-not $healthy) {
              Write-SmokeDiagnostics
            }
            throw
          } finally {
            Remove-SmokeService
          }


  security:
    name: Security scanners
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Vulnerability scan
        run: govulncheck ./...
      - name: Security static analysis
        run: gosec -quiet ./...
      - name: Go static analysis
        run: staticcheck ./...
      - name: Secret scan
        run: gitleaks dir . --no-banner --redact --exit-code 1
